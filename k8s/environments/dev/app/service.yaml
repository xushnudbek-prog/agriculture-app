apiVersion: v1
kind: Service
metadata:
  name: agri-app
  namespace: agri-dev
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: "/actuator/prometheus"
    prometheus.io/port: "80"
spec:
  selector:
    app: agri-app
  ports:
    - name: http
      port: 80
      targetPort: 8080
