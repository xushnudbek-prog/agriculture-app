replicaCount: 2

image:
  repository:
  tag: "1.0.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

resources:
  limits:
    cpu: 100m
    memory: 256Mi
  requests:
    cpu: 500m
    memory: 512Mi

probes:
  readinessPath: /actuator/health/readiness
  livenessPath: /actuator/health/liveness
