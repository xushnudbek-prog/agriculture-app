<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout}">

<head>
    <title>Suppliers</title>
</head>

<body>

    <div layout:fragment="content">

        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
            <div>
                <h2 style="margin: 0;">Suppliers</h2>
                <span style="color: var(--text-muted);">Trusted partners & sources</span>
            </div>
            <button class="btn-primary">
                <i class="fas fa-plus" style="margin-right: 0.5rem;"></i> New Supplier
            </button>
        </div>

        <!-- Grid Layout for Cards -->
        <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.5rem;">

            <div class="card" th:each="supplier : ${suppliers}">
                <div
                    style="display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 1.5rem;">
                    <div
                        style="width: 48px; height: 48px; background: #EFF6FF; color: var(--secondary); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem;">
                        <i class="fas fa-warehouse"></i>
                    </div>
                    <span class="badge-soft badge-info" th:text="${supplier.type}">Type</span>
                </div>

                <h3 style="font-size: 1.25rem; margin-bottom: 0.5rem;" th:text="${supplier.name}">Supplier Name</h3>
                <p style="color: var(--text-muted); font-size: 0.875rem; margin-bottom: 1.5rem;">
                    <i class="far fa-envelope" style="margin-right: 0.5rem;"></i>
                    <span th:text="${supplier.contactInfo}">Contact</span>
                </p>

                <button class="btn-outline" style="width: 100%; text-align: center;">View Profile</button>
            </div>

        </div>

    </div>

</body>

</html>
