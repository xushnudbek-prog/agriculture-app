<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout}">

<head>
    <title>Farmers</title>
</head>

<body>

    <div layout:fragment="content">

        <!-- Page Header -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
            <div>
                <h2 style="margin: 0;">Farmers Directory</h2>
                <span style="color: var(--text-muted);">Manage your producer network</span>
            </div>
            <button class="btn-primary">
                <i class="fas fa-plus" style="margin-right: 0.5rem;"></i> Add Farmer
            </button>
        </div>

        <!-- Table Card -->
        <div class="card" style="padding: 0; overflow: hidden;">
            <div style="padding: 1rem 1.5rem; border-bottom: 1px solid var(--border-color);">
                <div class="search-wrapper" style="max-width: 300px;">
                    <i class="fas fa-search search-icon"></i>
                    <input type="text" class="search-input" placeholder="Search farmers...">
                </div>
            </div>

            <table class="table-custom">
                <thead>
                    <tr>
                        <th style="padding-left: 1.5rem;">Farmer Profile</th>
                        <th>Location</th>
                        <th>Crop Type</th>
                        <th>Land Size (Ha)</th>
                        <th style="text-align: right; padding-right: 1.5rem;">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="farmer : ${farmers}">
                        <td style="padding-left: 1.5rem;">
                            <div style="display: flex; align-items: center; gap: 1rem;">
                                <div
                                    style="width: 40px; height: 40px; background: #ECFDF5; color: var(--primary); border-radius: 50%; display: flex; align-items: center; justify-content: center;">
                                    <i class="fas fa-user"></i>
                                </div>
                                <div>
                                    <div style="font-weight: 500;" th:text="${farmer.name}">Name</div>
                                    <small class="text-muted" th:text="${farmer.id}">ID</small>
                                </div>
                            </div>
                        </td>
                        <td>
                            <i class="fas fa-map-marker-alt" style="color: var(--danger); margin-right: 0.5rem;"></i>
                            <span th:text="${farmer.location}">Location</span>
                        </td>
                        <td>
                            <span class="badge-soft badge-info" th:text="${farmer.cropType}">Crop</span>
                        </td>
                        <td style="font-weight: 600;" th:text="${farmer.landSize}">0.0</td>
                        <td style="text-align: right; padding-right: 1.5rem;">
                            <button class="btn-outline"
                                style="border: none; color: var(--text-muted); padding: 0.25rem;">
                                <i class="fas fa-ellipsis-h"></i>
                            </button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

    </div>

</body>

</html>
